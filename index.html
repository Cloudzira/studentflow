<!DOCTYPE html>
<html lang="id" data-sx="m">
<head>

<link rel="manifest" href="manifest.webmanifest">

<style>

@font-face{font-family:Poppins;font-weight:500;src:url(assets/fonts/poppins-latin-500-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:Poppins;font-weight:600;src:url(assets/fonts/poppins-latin-600-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:Poppins;font-weight:700;src:url(assets/fonts/poppins-latin-700-normal.woff2) format('woff2');font-display:swap}

@font-face{font-family:FA;font-weight:900;src:url(assets/fa/fa-solid-900.woff2) format('woff2');font-display:block}
:root{--a:#3b82f6;--a2:#22d3ee;--bg:#f3f6fb;--sf:#fff;--sf2:#f5f8fc;--bd:#e1e8f4;--ink:#0f172a;--mu:#64748b;--ok:#10b981;--er:#ef4444;--wn:#f59e0b;--g:linear-gradient(135deg,var(--a),var(--a2));--sh:0 1px 2px #0f172a0d,0 10px 26px -14px #3b82f655;--fs:15px;--r:20px}
[data-sx=f]{--a:#ec4899;--a2:#a855f7;--bg:#fdf4fa;--sf2:#fbf0f8;--bd:#f1dcec;--ink:#2a1030;--mu:#85688a;--sh:0 1px 2px #2a10300d,0 10px 26px -14px #ec489955}
.dark{--bg:#0a101d;--sf:#111a2e;--sf2:#0d1526;--bd:#1f2c48;--ink:#e8eefc;--mu:#8393b3;--sh:0 1px 2px #0006,0 12px 30px -16px #000}
.dark[data-sx=f]{--bg:#140b1e;--sf:#1e1230;--sf2:#190f29;--bd:#35214c;--ink:#fbeefa;--mu:#b394b8}
body.sd{--fs:17px}body.sma{--fs:14.5px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:400 var(--fs)/1.5 Poppins,system-ui,sans-serif;color:var(--ink);min-height:100vh;background:radial-gradient(900px 380px at 50% -140px,color-mix(in srgb,var(--a) 16%,transparent),transparent),var(--bg) fixed}
button,input,select,textarea{font-family:inherit}
.fa{font-family:FA;font-weight:900;font-style:normal;line-height:1;display:inline-block}
.sp{flex:1;min-width:0}.row{display:flex;align-items:center;gap:10px}
.mn{max-width:900px;margin:auto}
aside{display:none}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px)}
.lm{width:40px;height:40px;border-radius:13px;background:var(--g);color:#fff;display:grid;place-items:center;font-size:17px;flex:none}
h1{margin:0;font-size:1.3em;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.top p{margin:0;font-size:.78em;color:var(--mu)}
.ib{width:40px;height:40px;border-radius:13px;border:1px solid var(--bd);background:var(--sf);color:var(--mu);font-size:15px;cursor:pointer;display:grid;place-items:center;flex:none}
.ib:hover{color:var(--a);border-color:var(--a)}
main{padding:4px 16px 120px}
.bn{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:6;display:flex;background:var(--sf);border:1px solid var(--bd);border-radius:22px;padding:6px;box-shadow:0 14px 40px -12px #0006}
.bn button{flex:1;border:0;background:none;color:var(--mu);font-size:.66em;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:16px;cursor:pointer}
.bn button .fa{font-size:17px}.bn .on{background:color-mix(in srgb,var(--a) 14%,transparent);color:var(--a);font-weight:600}
.fab{position:fixed;right:20px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:7;width:56px;height:56px;border-radius:19px;border:0;background:var(--g);color:#fff;font-size:20px;box-shadow:0 14px 30px -8px var(--a);cursor:pointer}
.btn.add{display:none}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px;color:#fff;background:var(--g);display:flex;gap:16px;align-items:center;box-shadow:0 20px 44px -18px var(--a)}
.hero:after{content:'';position:absolute;right:-50px;top:-60px;width:190px;height:190px;border-radius:50%;background:#ffffff1c}
.hero small{font-size:.72em;font-weight:500;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.hero h2{margin:2px 0 4px;font-size:1.3em;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.hero p{margin:0;font-size:.85em;opacity:.92}
.ring{--p:0;flex:none;width:84px;height:84px;border-radius:50%;background:conic-gradient(#fff calc(var(--p)*1%),#ffffff40 0);display:grid;place-items:center;position:relative;z-index:1}
.ring span{width:66px;height:66px;border-radius:50%;background:#0000004d;display:grid;place-items:center;font-weight:700;font-size:1.05em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stc{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:12px;box-shadow:var(--sh)}
.stc .fa{color:var(--a);font-size:15px}.stc b{display:block;font-size:1.35em;font-weight:700;line-height:1.2;margin-top:6px}.stc span{font-size:.72em;color:var(--mu)}
.sh{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 8px}

.cd{display:flex;align-items:center;gap:12px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:12px;margin:8px 0;box-shadow:var(--sh);cursor:pointer;transition:.15s}
.cd:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--a) 45%,var(--bd))}
.cd.now{border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 20%,transparent)}
.tl{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;font-size:16px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.t{font-weight:600;font-size:.95em;line-height:1.3;overflow:hidden;text-overflow:ellipsis}.m{font-size:.78em;color:var(--mu)}
.done .t{text-decoration:line-through;color:var(--mu)}.done{opacity:.7}
.tag{font-size:.7em;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap;background:color-mix(in srgb,var(--a) 14%,transparent);color:var(--a)}
.tag.er{background:color-mix(in srgb,var(--er) 15%,transparent);color:var(--er)}.tag.wn{background:color-mix(in srgb,var(--wn) 18%,transparent);color:#b45309}.dark .tag.wn{color:var(--wn)}.tag.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.ck{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--bd);flex:none;display:grid;place-items:center;cursor:pointer;background:var(--sf2);padding:0}
.ck:checked{background:var(--g);border-color:transparent}.ck:checked:after{content:'\f00c';font:900 11px FA;color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--bd);background:var(--sf);color:var(--mu);padding:7px 14px;border-radius:99px;font-size:.82em;font-weight:500;cursor:pointer}
.chip.on{background:var(--g);color:#fff;border-color:transparent;font-weight:600}
.emp{text-align:center;padding:26px 10px;color:var(--mu);font-size:.85em;border:1.5px dashed var(--bd);border-radius:var(--r);margin:8px 0}.emp .tl{margin:0 auto 8px}
dialog{border:1px solid var(--bd);border-radius:26px;background:var(--sf);color:var(--ink);width:min(92vw,460px);padding:22px;max-height:90vh}
dialog::backdrop{background:#020617a6;backdrop-filter:blur(5px)}
dialog h3{margin:0 0 4px;font-size:1.1em;font-weight:700}
label{display:block;font-size:.76em;font-weight:500;color:var(--mu);margin:12px 0 5px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:14px;border:1px solid var(--bd);background:var(--sf2);color:var(--ink);font-size:.93em}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--a) 45%,transparent);border-color:var(--a)}
input[type=checkbox]{width:auto;vertical-align:middle}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:14px;padding:10px 18px;background:var(--g);color:#fff;font-size:.88em;font-weight:600;cursor:pointer}
.btn.gh{background:var(--sf2);color:var(--ink);border:1px solid var(--bd)}.btn.dg{background:var(--er)}
@media(min-width:900px){
.app{display:grid;grid-template-columns:250px 1fr}
aside{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:24px 14px;background:var(--sf);border-right:1px solid var(--bd)}
aside .lg{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.1em;letter-spacing:-.02em;padding:0 8px 22px}
aside button{display:flex;align-items:center;gap:14px;border:0;background:none;color:var(--mu);font-size:.9em;font-weight:500;padding:12px 14px;border-radius:15px;cursor:pointer;text-align:left}
aside button .fa{width:18px;text-align:center}aside button:hover{background:var(--sf2)}aside .on{background:color-mix(in srgb,var(--a) 13%,transparent);color:var(--a);font-weight:600}
.top>.lm{display:none}.bn,.fab{display:none!important}.btn.add{display:inline-flex}.top{padding:24px 28px 12px}main{padding:6px 28px 48px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}}
.dh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fs{border-top:1px solid var(--bd);margin-top:16px;padding-top:14px}.dh+.fs{border:0;margin-top:6px;padding-top:0}
.fs h4{margin:0;font-size:.72em;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--a)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hn{font-size:.76em;color:var(--mu);margin:6px 0 10px}
.sw{display:flex;gap:10px;align-items:flex-start;font-size:.85em;color:var(--ink);margin:10px 0 0;font-weight:400}.sw input{margin-top:3px}
.ft{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--bd)}
dialog{overflow:auto}
input.ck{width:24px;height:24px}[data-sx=rm]{--a:#16a34a;--a2:#14b8a6;--bg:#effaf4;--sf2:#eaf6ef;--bd:#cfe9da;--ink:#052e1c;--mu:#52806a;--sh:0 1px 2px #052e1c0d,0 10px 26px -14px #16a34a66}
[data-sx=rf]{--a:#f43f5e;--a2:#fb923c;--bg:#fff4f1;--sf2:#fff0eb;--bd:#f8d9d0;--ink:#3b1218;--mu:#8a6068;--sh:0 1px 2px #3b12180d,0 10px 26px -14px #f43f5e66}
.dark[data-sx=rm]{--bg:#07130e;--sf:#0e1d16;--sf2:#0a1812;--bd:#1b3a2b;--ink:#e6fbf0;--mu:#86b09b}
.dark[data-sx=rf]{--bg:#1a0d0f;--sf:#281519;--sf2:#200f13;--bd:#4a2428;--ink:#ffeef0;--mu:#c79aa1}
.pn{background:var(--sf);border:1px solid var(--bd);border-radius:26px;padding:26px 18px;text-align:center;box-shadow:var(--sh);margin:10px 0}
.dgt{font-size:3em;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.pn .sub{color:var(--mu);font-size:.85em;margin-top:6px}.ctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.ring2{--p:100;width:236px;height:236px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:conic-gradient(var(--a) calc(var(--p)*1%),color-mix(in srgb,var(--a) 16%,transparent) 0)}
.ring2>div{width:198px;height:198px;border-radius:50%;background:var(--sf);display:grid;place-items:center;align-content:center}.ring2 .dgt{font-size:2.5em}
.lap{display:flex;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--bd);font-size:.88em;font-variant-numeric:tabular-nums}.lap span:first-child{color:var(--mu)}
.tin{display:flex;gap:8px;margin-top:14px;justify-content:center}.tin input{max-width:150px;text-align:center}
.stats+.chips{margin-top:14px}
.dt{position:relative;display:flex;gap:8px;align-items:center}.dt input[type=text]{flex:1;min-width:0}.dt .hd{position:absolute;right:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;padding:0;border:0}
#cal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#020617a6;backdrop-filter:blur(6px);animation:fi .18s}
.cp{width:min(92vw,360px);background:var(--sf);border:1px solid var(--bd);border-radius:28px;padding:18px;box-shadow:0 30px 80px -20px #000c,0 0 0 1px color-mix(in srgb,var(--a) 28%,transparent);animation:pop .24s cubic-bezier(.2,.9,.3,1.15)}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ct{border:0;background:none;color:var(--ink);font:700 1.02em Poppins,sans-serif;padding:8px 14px;border-radius:12px;cursor:pointer}.ct:hover{background:var(--sf2)}
.wd{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.wd span{text-align:center;font-size:.68em;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);padding:6px 0}
.dy{position:relative;aspect-ratio:1;border:0;border-radius:14px;background:none;color:var(--ink);font:500 .9em Poppins,sans-serif;cursor:pointer;transition:.12s}
.dy:hover{background:color-mix(in srgb,var(--a) 15%,transparent)}.dy.o{color:var(--mu);opacity:.4}
.dy.t{box-shadow:inset 0 0 0 1.5px var(--a);color:var(--a);font-weight:700}
.dy.s{background:var(--g);color:#fff;font-weight:700;box-shadow:0 8px 20px -6px var(--a)}
.dy.e:after{content:'';position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--a2)}.dy.s.e:after{background:#fff}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 0}.mg .dy{aspect-ratio:auto;padding:16px 0;border-radius:16px}
.cf{display:flex;gap:8px;margin-top:14px}.cf .btn{flex:1;justify-content:center;padding:10px 6px}
@keyframes fi{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}}
@media(max-width:600px){#cal{place-items:end center}.cp{width:100%;border-radius:28px 28px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom))}}
img.lm{background:none;object-fit:contain;border-radius:12px;box-shadow:0 8px 20px -8px var(--a)}
</style>

<body>
<div class="app"><aside id="sb"></aside><div class="mn"><header class="top"><img class="lm" src="icons/icon.svg" alt="StudentFlow"><div class="sp"><h1 id="ti"></h1><p id="dt"></p></div><button class="btn add" id="add"><i class="fa">&#xf067;</i>Tambah</button><button class="ib" id="bx" title="Gaya"></button><button class="ib" id="bm" title="Mode"></button><button class="ib" id="bs" title="Pengaturan"><i class="fa">&#xf013;</i></button></header><main id="v"></main></div></div>
<button class="fab" id="fab"><i class="fa">&#xf067;</i></button>
<nav class="bn" id="nv"></nav>
<dialog id="dl"></dialog>
<script>
const $=s=>document.querySelector(s),H=document.documentElement;
const DAYS=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const LV={SD:['Matematika','Bahasa Indonesia','IPAS','Bahasa Inggris','PJOK','Seni Budaya','Agama','PPKn'],SMP:['Matematika','Bahasa Indonesia','Bahasa Inggris','IPA','IPS','PPKn','Informatika','PJOK','Seni Budaya','Agama'],SMA:['Matematika','Bahasa Indonesia','Bahasa Inggris','Fisika','Kimia','Biologi','Sejarah','Ekonomi','Sosiologi','Informatika','PJOK','Agama']};
let D=JSON.parse(localStorage.getItem('sf')||'null')||{p:{n:'',lv:'SMP',sx:'m',th:'auto'},sub:LV.SMP,jd:[],tg:[],uj:[],kg:[]};
D.log=D.log||{};
let tab='home',day=new Date().getDay(),fl={tg:'',uj:'',kg:''},showDone=false;
const save=()=>{D.t=Date.now();localStorage.setItem('sf',JSON.stringify(D));push()};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0'),td=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const dd=s=>Math.round((new Date(s+'T00:00')-new Date(td()+'T00:00'))/864e5);
const rel=n=>n<0?'Lewat '+-n+' hari':n==0?'Hari ini':n==1?'Besok':n+' hari lagi';
const col=s=>'hsl('+([...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)*37%360)+' 66% 55%)';
const fd=s=>s?s.split('-').reverse().join('/'):'';
const E={
 jd:{n:'Pelajaran',f:[['sub','Mata pelajaran','sub'],['day','Hari','day'],['st','Mulai','time'],['en','Selesai','time'],['rm','Guru / Ruang','text']]},
 tg:{n:'PR / Tugas',f:[['ti','Judul','text'],['sub','Mata pelajaran','sub'],['ty','Jenis',['PR','Tugas','Proyek']],['du','Tenggat','date'],['nt','Catatan','text']]},
 uj:{n:'Ujian / Penilaian',f:[['ti','Nama','text'],['sub','Mata pelajaran','sub'],['ty','Jenis',['Formatif','Sumatif','UTS','UAS','Ulangan']],['dt','Tanggal','date'],['sc','Nilai (isi setelah keluar)','number']]},
 kg:{n:'Kegiatan',f:[['ti','Nama kegiatan','text'],['ct','Kategori',['Sekolah','Organisasi','Ekskul','Proyek']],['dt','Tanggal','date'],['tm','Jam','time'],['pl','Tempat','text']]}
};
const I=c=>`<i class="fa">&#x${c};</i>`;
const CT={Sekolah:'f549',Organisasi:'f0c0',Ekskul:'f1e3',Proyek:'f0c3'},TI={PR:'f15c',Tugas:'f304',Proyek:'f0c3'};
const TABS=[['home','f015','Beranda'],['jd','f073','Jadwal'],['tg','f0ae','Tugas'],['uj','f31c','Ujian'],['kg','f140','Kegiatan'],['wk','f017','Waktu']];
const PT={home:'Beranda',jd:'Jadwal Pelajaran',tg:'PR & Tugas',uj:'Ujian & Penilaian',kg:'Kegiatan Siswa',wk:'Waktu Belajar'};
function theme(){const p=D.p;H.dataset.sx=p.sx;H.classList.toggle('dark',p.th=='dark'||(p.th=='auto'&&matchMedia('(prefers-color-scheme:dark)').matches));document.body.className=p.lv.toLowerCase();$('#bx').innerHTML=I({m:'f222',f:'f221',rm:'f0e7',rf:'f005'}[p.sx]||'f222');$('#bm').innerHTML=I(H.classList.contains('dark')?'f185':'f186')}
const tile=(c,ic)=>`<span class="tl" style="--c:${c}">${I(ic)}</span>`;
const sh=(t,n)=>`<div class="sh"><h3>${t}</h3>${n!=null?`<span>${n}</span>`:''}</div>`;
const chips=(k,opts)=>'<div class="chips">'+['',...opts].map(o=>`<button class="chip ${fl[k]==o?'on':''}" onclick="fl.${k}='${esc(o)}';go()">${o||'Semua'}</button>`).join('')+'</div>';
const items=(arr,fn,ic,msg)=>arr.length?arr.map(fn).join(''):`<div class="emp">${tile('var(--a)',ic)}${msg||'Belum ada data.'}</div>`;
const stat=(ic,v,l)=>`<div class="stc">${I(ic)}<b>${v}</b><span>${l}</span></div>`;
